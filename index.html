<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0D0F0E" />
    <title>PETRA</title>
    <script>
      // Thème du dernier lancement posé tout de suite (src/ui/theme.ts applyTheme), avant les styles et l'appli.
      try {
        var t = JSON.parse(localStorage.getItem('petra.theme'))
        document.documentElement.dataset.theme = t[0]
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
